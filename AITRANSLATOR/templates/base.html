<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI SignBridge{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  {% block head %}{% endblock %}
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon"><i class="bi bi-hand-index-thumb fs-4"></i></div>
        <div>
          <strong>AI SignBridge</strong>
          <span class="d-block small text-white-50">Two-way translator</span>
        </div>
      </div>
      <nav class="nav-list">
        <a class="nav-pill {% if active_page == 'dashboard' %}active{% endif %}" href="{{ url_for('index') }}"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="nav-pill {% if active_page == 'live' %}active{% endif %}" href="{{ url_for('live_page') }}"><i class="bi bi-camera-video"></i> Live Detection</a>
        <a class="nav-pill {% if active_page == 'convert' %}active{% endif %}" href="{{ url_for('convert_page') }}"><i class="bi bi-translate"></i> Text to Sign</a>
        <a class="nav-pill {% if active_page == 'upload' %}active{% endif %}" href="{{ url_for('upload_page') }}"><i class="bi bi-cloud-arrow-up"></i> Upload Predict</a>
        <a class="nav-pill {% if active_page == 'gallery' %}active{% endif %}" href="{{ url_for('gallery_page') }}"><i class="bi bi-collection-play"></i> Sign Videos</a>
        <a class="nav-pill {% if active_page == 'training' %}active{% endif %}" href="{{ url_for('training_page') }}"><i class="bi bi-graph-up"></i> Training</a>
        <a class="nav-pill {% if active_page == 'history' %}active{% endif %}" href="{{ url_for('history_page') }}"><i class="bi bi-database"></i> History</a>
      </nav>
      <div class="sidebar-card">
        <div class="small text-white-50">Available signs</div>
        <div class="fs-3 fw-bold">{{ total_signs }}</div>
        <div class="small text-white-50">Model: {{ "ready" if model_ready else "missing" }}</div>
      </div>
    </aside>

    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    window.APP_ROUTES = {
      current: "{{ url_for('current_prediction') }}",
      start: "{{ url_for('start_prediction') }}",
      stop: "{{ url_for('stop_prediction') }}",
      upload: "{{ url_for('predict_upload') }}",
      text: "{{ url_for('text_to_sign') }}"
    };
  </script>
  {% block scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
